llm:
  model: qwen3:8b                   # Apache 2.0; qwen3:8b answers better but needs a GPU with ~8 GB+ VRAM (ollama pull qwen3:8b)
  base_url: http://localhost:11434
  temperature: 0.0                  # 0 = deterministic answers, least invention
  max_tokens: 2048

embeddings:
  model: nomic-embed-text           # Apache 2.0
  base_url: http://localhost:11434

retrieval:
  chunk_size: 600                   # characters per chunk (larger = more context per hit)
  chunk_overlap: 100                # overlap between adjacent chunks (fewer details lost at boundaries)
  top_k: 8                          # chunks retrieved per query (specific details such as colours or counts are less likely to be missed)

storage:
  documents_dir: data/documents
  chroma_dir: data/chroma_db
  chroma_collection: scurelocalai
  figures_dir: data/figures         # cropped images shown in chat

server:
  host: 127.0.0.1
  port: 8000

vision:                             # Visualizing.py - locating images / charts / diagrams in PDFs
  output_dir: data/figures          # figures.json, crops and annotated pages are written here
  crop_dpi: 150                     # resolution of saved figure crops (what the VLM will see)
  min_side_pt: 28                   # ignore visuals smaller than this (icons, bullets)
  cluster_gap_pt: 9                 # vector strokes closer than this form one figure
  vector_min_score: 0.45            # raise to be stricter about vector charts/diagrams
  drop_recurring: true              # drop logos repeated on 3+ pages
  raster_enabled: true              # pixel analysis for scanned pages

figures:                            # images in chat: "show me the workflow diagram"
  enabled: true                     # detect + index pictures when a PDF is uploaded
  describe_mode: "all"              # off | uncaptioned | all - local vision model describes pictures (ollama pull qwen2.5vl:3b)
  vlm_model: qwen2.5vl:3b           # any Ollama vision model; if it is missing, descriptions are skipped and uploads still work
  describe_prompt: detailed         # detailed (people, clothing colours, counts, text, diagram labels) | brief
  vlm_max_px: 768                   # longest side sent to the vision model (smaller = faster)
  index_descriptions: true          # descriptions are also searchable as text, so normal questions can use them
  max_images: 3                     # images returned per answer
  min_keyword_overlap: 0.34         # a figure matches if this share of the question's keywords is in its text
  semantic_max_distance: 0.40       # ...or if its meaning is this close to the question (0 = identical)

structure:                          # chapter/section detection for PDFs (used to link images to text)
  enabled: true                     # adds section info to indexed chunks and images; never blocks uploads
  use_outline: true                 # trust the PDF's own bookmarks when it has them
  max_heading_words: 16             # longer lines are never headings
  min_heading_size_ratio: 1.15      # heading font size / body font size
  max_levels: 4                     # deepest heading level kept

ocr:                                # scanned PDF pages (no text layer) are read with Tesseract
  enabled: true                     # skipped automatically if the Tesseract program is not installed
  language: eng                     # Tesseract language code, e.g. eng, hin, eng+hin
  dpi: 300                          # render resolution for OCR
  tesseract_cmd: ""                 # empty = auto-detect; or e.g. C:\Program Files\Tesseract-OCR\tesseract.exe
