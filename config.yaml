llm:
  model: qwen3:4b                   # Apache 2.0; use qwen3:8b for higher quality on roomier machines
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 2048

embeddings:
  model: nomic-embed-text           # Apache 2.0
  base_url: http://localhost:11434

retrieval:
  chunk_size: 512                   # characters per chunk
  chunk_overlap: 64                 # overlap between adjacent chunks
  top_k: 5                          # chunks retrieved per query

storage:
  documents_dir: data/documents
  chroma_dir: data/chroma_db
  chroma_collection: scurelocalai
  figures_dir: data/figures         # cropped images shown in chat

server:
  host: 127.0.0.1
  port: 8000

vision:                             # Visualizing.py - locating images / charts / diagrams in PDFs
  output_dir: data/figures          # figures.json, crops and annotated pages are written here
  crop_dpi: 150                     # resolution of saved figure crops (what the VLM will see)
  min_side_pt: 28                   # ignore visuals smaller than this (icons, bullets)
  cluster_gap_pt: 9                 # vector strokes closer than this form one figure
  vector_min_score: 0.45            # raise to be stricter about vector charts/diagrams
  drop_recurring: true              # drop logos repeated on 3+ pages
  raster_enabled: true              # pixel analysis for scanned pages

figures:                            # images in chat: "show me the workflow diagram"
  enabled: true                     # detect + index pictures when a PDF is uploaded
  describe_mode: "off"              # off | uncaptioned | all - local vision model writes descriptions
  vlm_model: qwen2.5vl:3b           # only used when describe_mode is not off (ollama pull <model>)
  max_images: 3                     # images returned per answer
  min_keyword_overlap: 0.34         # a figure matches if this share of the question's keywords is in its text
  semantic_max_distance: 0.40       # ...or if its meaning is this close to the question (0 = identical)
